# 打包扩展并发布到 GitHub Releases
# 触发：推送 v* 版本 tag（如 git tag v1.2.0 && git push --tags），或手动运行
# 产物：chrome / firefox / safari 三个 zip，用户可直接下载安装

name: Package and release extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run compile

      - name: Smoke tests
        run: npm test

      - name: Package all browsers
        run: |
          npm run zip
          npm run zip:firefox
          npm run zip:safari

      - name: Collect artifacts
        run: |
          mkdir -p release
          cp .output/translate-ext-*-chrome.zip release/
          cp .output/translate-ext-*-firefox.zip release/
          cp .output/translate-ext-*-safari.zip release/
          ls -la release/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          gh release create "v${VERSION}" release/*.zip \
            --title "translate-ext v${VERSION}" \
            --generate-notes \
            --notes-before-body "$(cat <<'EOF'
          ### 安装方法

          **Chrome / Edge** — 下载 `chrome.zip` 并解压到固定目录 → 打开 `chrome://extensions` → 开启「开发者模式」→「加载已解压的扩展程序」选择解压目录。（Edge 在 `edge://extensions`，同样流程）

          **Firefox** — 下载 `firefox.zip` → 打开 `about:debugging#/runtime/this-firefox` →「临时载入附加组件」选择 zip；或解压后通过 `web-ext run` 使用。

          **Safari** — 下载 `safari.zip`，用 Xcode `xcrun safari-web-extension-converter` 封装为 App 后在 Safari 设置中启用（详见仓库 README）。
          EOF
          )" || gh release upload "v${VERSION}" release/*.zip --clobber
