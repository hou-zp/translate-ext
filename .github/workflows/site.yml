# 构建介绍页并发布到 Cloudflare Pages
# 触发：main 分支上 site/ 目录有改动，或手动运行（Actions → site → Run workflow）
# 所需 repo secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   — Cloudflare 控制台创建，模板 "Cloudflare Pages — Edit"
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 控制台右下角 Account ID

name: Deploy intro site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同一时刻只跑一个部署，排队中的旧运行自动取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Typecheck
        working-directory: site
        run: npm run typecheck

      - name: Build
        working-directory: site
        run: npm run build

      - name: Create Pages project (skip if exists)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create translate-ext --production-branch=main
        continue-on-error: true # 已存在时报错，属预期

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=translate-ext --branch=main --commit-dirty=true
